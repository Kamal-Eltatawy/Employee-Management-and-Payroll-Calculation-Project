# Builds and tests everything on every push and pull request (D63).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET build + unit and integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Payroll.slnx

      - name: Build (warnings are errors)
        run: dotnet build Payroll.slnx --configuration Release --no-restore

      # The integration tests start SQL Server with Testcontainers; GitHub's Ubuntu runners have Docker.
      - name: Test
        run: dotnet test --solution Payroll.slnx --configuration Release --no-build

  frontend:
    name: Frontend (Angular build in en + ar, logic tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (TypeScript + template accessibility)
        run: npm run lint

      - name: Build (production, both locales)
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false

  e2e:
    name: End-to-end smoke test (docker compose + Playwright, en + ar)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # The demo values from .env.example are enough for a throw-away CI stack.
      - name: Environment
        run: cp .env.example .env

      # Only the long-running services: the one-shot `urls` service exits, which would make --wait fail.
      - name: Start the stack (db, api, web)
        run: docker compose up -d --build --wait --wait-timeout 600 db api web

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        working-directory: client
        run: |
          export E2E_HR_PASSWORD="$(grep '^Seed__HrPassword=' ../.env | cut -d= -f2-)"
          npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker:
    name: Docker images (published to GHCR from main)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Image names must be lower-case: ghcr.io/<owner>/<repo>-api and -web.
      - name: Image names
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build; a push to main also publishes (D64).
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Payroll.Api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Web image (Angular en + ar behind nginx)
        uses: docker/build-push-action@v6
        with:
          context: client
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
