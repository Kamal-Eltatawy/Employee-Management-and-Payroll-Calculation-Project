# Included by every location that sends a response, because nginx drops server-level add_header
# directives in any location that has its own add_header (for example the Cache-Control ones below).
# CSP: the Angular build loads only same-origin scripts (critical-CSS inlining is off in angular.json, so there is
# no inline script); component styles are injected as <style> elements, hence style-src 'unsafe-inline'.
# Bootstrap's form controls use data: SVG backgrounds, hence img-src data:.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
