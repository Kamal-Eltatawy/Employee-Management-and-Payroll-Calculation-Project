# Same origin for the app and the API (like the dev proxy, S8): no CORS, and the refresh cookie (Path=/api/auth) just works.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Client-side routes (/employees, /my-payslip, …) all load the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
