# One build per language (Angular i18n, D56): /en/ and /ar/. Same origin for the app and the API (S8):
# no CORS, and the refresh cookie (Path=/api/auth) works for both languages.
map $http_accept_language $preferred_language {
    default en;
    ~*^ar   ar;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Security headers for responses served here (redirects, errors). Locations with their own add_header include them again.
    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Hashed bundles (outputHashing: all) never change under the same name: cache them for a year.
    location ~* ^/(en|ar)/.+\.(?:js|css|woff2?|ttf|otf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html (and every client-side route that falls back to it) must be revalidated so a deploy is seen at once.
    location ~ ^/(en|ar)/index\.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes (/en/employees, /ar/my-payslip, …) load that language's SPA.
    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }

    location /ar/ {
        try_files $uri $uri/ /ar/index.html;
    }

    location = / {
        return 302 /$preferred_language/;
    }

    location / {
        return 302 /$preferred_language$request_uri;
    }
}
