<header class="app-header navbar navbar-expand navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/">Payroll</a>
    @if (auth.currentUser(); as user) {
      <nav class="navbar-nav me-auto">
        @if (user.role === 'Hr') {
          <a class="nav-link" routerLink="/employees" routerLinkActive="active">Employees</a>
        } @else {
          <a class="nav-link" routerLink="/my-payslip" routerLinkActive="active">My payslip</a>
        }
      </nav>
      <div class="d-flex align-items-center gap-3 text-white">
        <span class="small opacity-75">{{ user.email }} · {{ user.role }}</span>
        <button type="button" class="btn btn-sm btn-outline-light" (click)="auth.logout()">Sign out</button>
      </div>
    }
  </div>
</header>

<main class="container py-4">
  <router-outlet />
</main>

<app-toasts />
