name: payroll

# Local development: `docker compose up -d db` starts only the database (the API and client run from the IDE / CLI).
# Everything in containers: `docker compose up --build`, then open http://localhost:8080.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "14333:1433"   # 14333 on the host: a local SQL Server instance often owns 1433
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Payroll.Api/Dockerfile
    env_file: .env   # Jwt__* and Seed__* (secrets stay in .env)
    environment:
      # Development: applies the migrations, seeds the demo data and serves Swagger UI. This compose file is for demos.
      ASPNETCORE_ENVIRONMENT: Development
      # Inside the compose network the database is "db" on 1433 (overrides the host value from .env).
      ConnectionStrings__Default: "Server=db,1433;Database=Payroll;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5081:8080"    # Swagger UI at http://localhost:5081/swagger (5081 so it never clashes with `dotnet run` on 5080)

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:80"      # the app: http://localhost:8080 (redirects to /en/ or /ar/)
    healthcheck:
      # /health goes through nginx to the API, so "healthy" means the app, the API and the database all answer.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  # Prints every address once everything is ready (visible in `docker compose up`; start.ps1 prints them too).
  urls:
    image: busybox:1.37
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo ''
        echo '================ Payroll is ready ================'
        echo '  App (English)  http://localhost:8080/en/'
        echo '  App (Arabic)   http://localhost:8080/ar/'
        echo '  Swagger UI     http://localhost:5081/swagger'
        echo '  Health         http://localhost:8080/health'
        echo '  SQL Server     localhost,14333 (user sa, password from .env)'
        echo '=================================================='

volumes:
  sqldata:
